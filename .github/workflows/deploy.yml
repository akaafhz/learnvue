name: Deploy Grey LearnVue

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        run: |
          cd /var/www/app/learnvue
          git fetch origin main
          git reset --hard origin/main

      - name: Install dependencies
        run: |
          cd /var/www/app/learnvue
          pnpm install

      - name: Build frontend
        run: |
          cd /var/www/app/learnvue
          pnpm run build

      - name: Reload nginx
        run: |
          nginx -t
          systemctl reload nginx
